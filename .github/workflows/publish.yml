name: Publish to PyPI

# Runs when a release is published on GitHub.  The tag has to match the version
# in src/waldmann_enocean/__init__.py, with or without a leading "v".
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check the tag against the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/waldmann_enocean-$version.tar.gz" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the package version:"
            ls dist
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/waldmann-enocean
    permissions:
      id-token: write  # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
